<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevNexus — Universal Dynamic Pricing Platform</title>
    <meta
      name="description"
      content="Configure, test, deploy and operate real-time pricing strategies for any business domain."
    />
    <meta name="color-scheme" content="dark light" />
    <!--
      The background is set here as well as in CSS so the first paint is already
      dark. Without it there is a white flash before the stylesheet applies,
      which on a dark product is the first thing anyone notices.
    -->
    <style>
      html { background: #0a0a0b; }
      html[data-theme="light"] { background: #ffffff; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0b'/%3E%3Cpath d='M9 22V10h5.5a6 6 0 0 1 0 12H9Z' fill='none' stroke='%23e8a33d' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
