<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ride Booking · Surge Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body data-domain="ride">
<header class="topbar">
  <div class="brand"><span class="logo">Ride Booking</span><span class="sub">Surge Control Room</span></div>
  <div class="status" id="status">
    <span class="pill" id="connPill"><i class="led"></i><span id="connText">Connecting…</span></span>
  </div>
  <div class="actions">
    <button class="btn primary" id="runAllBtn">▶ Run all in sequence</button>
  </div>
</header>

</div>

<section class="city">
  <div class="city-head"><span>City conditions</span><small id="surgeHeadline">calm</small></div>
  <div class="gtiles" id="gtiles"></div>
</section>

<main class="layout2">
  <section class="panel rides-panel">
    <div class="panel-head"><h2>Live fares</h2><small id="tripLabel"></small></div>
    <div class="grid" id="rideGrid"></div>
  </section>

  <aside class="panel scenarios">
    <div class="panel-head"><h2>Test scenarios</h2><small>press Run to execute · it's real</small></div>
    <div class="cases" id="cases"></div>
  </aside>
</main>

<div class="loading" id="loading"><div class="spinner"></div><p>Connecting to the fare engine…</p></div>
<script src="app.js"></script>
</body>
</html>
