<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Banking · Rate Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body data-domain="bank">
<header class="topbar">
  <div class="brand"><span class="mark">◈</span><span class="logo">Banking</span><span class="sub">Lending Rate Desk</span></div>
  <div class="status" id="status">
    <span class="pill" id="connPill"><i class="led"></i><span id="connText">Connecting…</span></span>
  </div>
  <div class="actions">
    <button class="btn primary" id="runAllBtn">▶ Run all in sequence</button>
  </div>
</header>

</div>

<section class="market">
  <div class="market-head"><span>Market conditions</span><small>live · drives every quote</small></div>
  <div class="gtiles" id="gtiles"></div>
</section>

<main class="layout2">
  <section class="panel rates-panel">
    <div class="panel-head"><h2>Live offered rates (APR)</h2><small id="profLabel"></small></div>
    <div class="ratelist" id="rateList"></div>
  </section>
  <aside class="panel scenarios">
    <div class="panel-head"><h2>Test scenarios</h2><small>press Run · it's real</small></div>
    <div class="cases" id="cases"></div>
  </aside>
</main>

<div class="loading" id="loading"><div class="spinner"></div><p>Connecting to the rate engine…</p></div>
<script src="app.js"></script>
</body>
</html>
